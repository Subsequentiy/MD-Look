<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="application-name" content="MD Look">
<meta name="version" content="1.2.0">
<meta name="build" content="2026-11-12">
<title>MD Look</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230969da'/%3E%3Ctext x='12' y='17' font-size='10' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3EMD%3C/text%3E%3C/svg%3E">
<script>
/* 深浅色跟随系统：放在样式之前执行，保证首帧就是正确主题，不会闪白 */
(function () {
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  function apply() {
    document.documentElement.setAttribute('data-theme', mq.matches ? 'dark' : 'light');
  }
  apply();
  if (mq.addEventListener) mq.addEventListener('change', apply);
  else if (mq.addListener) mq.addListener(apply);
})();
</script>
<style>
/* ============ 主题变量 ============ */
:root {
  --bg: #ffffff;
  --bg-soft: #f7f8fa;
  --bg-elev: #ffffff;
  --bg-hover: rgba(9, 105, 218, .07);
  --bg-active: rgba(9, 105, 218, .12);
  --text: #1f2328;
  --text-soft: #57606a;
  --muted: #6e7781;
  --border: #e3e6ea;
  --border-strong: #d0d7de;
  --accent: #0969da;
  --accent-contrast: #ffffff;
  --danger: #cf222e;
  --danger-bg: rgba(207, 34, 46, .08);
  --danger-border: rgba(207, 34, 46, .38);
  --code-bg: #f6f8fa;
  --code-border: #e3e6ea;
  --inline-code-bg: rgba(175, 184, 193, .25);
  --quote-bg: rgba(9, 105, 218, .045);
  --mark: #fff8c5;
  --shadow: 0 8px 28px rgba(31, 35, 40, .10);
  --scrollbar: #c9d1d9;
  --scrollbar-hover: #adb5bd;
  /* 代码高亮 */
  --hl-keyword: #cf222e; --hl-string: #0a3069; --hl-number: #0550ae; --hl-comment: #6e7781;
  --hl-title: #8250df; --hl-attr: #0550ae; --hl-builtin: #953800; --hl-literal: #0550ae;
  --hl-type: #8250df; --hl-meta: #6e7781; --hl-tag: #116329; --hl-symbol: #953800;
  --hl-addition: #116329; --hl-addition-bg: #dafbe1; --hl-deletion: #82071e; --hl-deletion-bg: #ffebe9;
  --content-font: 16px;
}
html[data-theme="dark"] {
  --bg: #0d1117;
  --bg-soft: #10141b;
  --bg-elev: #161b22;
  --bg-hover: rgba(88, 166, 255, .10);
  --bg-active: rgba(88, 166, 255, .18);
  --text: #e6edf3;
  --text-soft: #9da7b3;
  --muted: #7d8590;
  --border: #30363d;
  --border-strong: #3d444d;
  --accent: #58a6ff;
  --accent-contrast: #0d1117;
  --danger: #ff7b72;
  --danger-bg: rgba(248, 81, 73, .14);
  --danger-border: rgba(248, 81, 73, .42);
  --code-bg: #161b22;
  --code-border: #30363d;
  --inline-code-bg: rgba(110, 118, 129, .35);
  --quote-bg: rgba(88, 166, 255, .06);
  --mark: #bb800933;
  --shadow: 0 8px 28px rgba(1, 4, 9, .6);
  --scrollbar: #30363d;
  --scrollbar-hover: #484f58;
  --hl-keyword: #ff7b72; --hl-string: #a5d6ff; --hl-number: #79c0ff; --hl-comment: #8b949e;
  --hl-title: #d2a8ff; --hl-attr: #79c0ff; --hl-builtin: #ffa657; --hl-literal: #79c0ff;
  --hl-type: #d2a8ff; --hl-meta: #8b949e; --hl-tag: #7ee787; --hl-symbol: #ffa657;
  --hl-addition: #aff5b4; --hl-addition-bg: #033a16; --hl-deletion: #ffdcd7; --hl-deletion-bg: #67060c;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }
button { font: inherit; color: inherit; }
svg { display: block; }

/* ============ 布局 ============ */
#app { display: flex; flex-direction: column; height: 100vh; }
.topbar {
  position: relative;
  flex: none;
  height: 50px;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 10px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-elev);
  z-index: 30;
}
.toolbar-group { display: flex; align-items: center; gap: 2px; }
.toolbar-group + .toolbar-group { margin-left: 4px; padding-left: 8px; border-left: 1px solid var(--border); }
.tb-btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 32px; padding: 0 9px;
  border: 1px solid transparent; border-radius: 7px;
  background: transparent; cursor: pointer; color: var(--text-soft);
  white-space: nowrap; transition: background .12s, color .12s, border-color .12s;
}
.tb-btn:hover { background: var(--bg-hover); color: var(--text); }
.tb-btn:active { background: var(--bg-active); }
.tb-btn.icon-only { width: 32px; padding: 0; justify-content: center; }
.tb-btn.active { background: var(--bg-active); color: var(--accent); }
.tb-btn:disabled { opacity: .45; cursor: default; }
.tb-btn.zoom { font-size: 12.5px; font-weight: 600; letter-spacing: -.02em; }
.icon { width: 16px; height: 16px; flex: none; }

.doc-title {
  flex: 1 1 auto; min-width: 0;
  display: flex; flex-direction: column; justify-content: center;
  padding: 0 6px 0 12px;
}
.doc-title .name {
  font-size: 13.5px; font-weight: 600; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.doc-title .path {
  font-size: 11.5px; color: var(--muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.progress {
  position: absolute; left: 0; bottom: -1px; height: 2px; width: 0;
  background: linear-gradient(90deg, var(--accent), #a371f7);
  transition: width .08s linear; z-index: 1;
}

.main { flex: 1; display: flex; min-height: 0; position: relative; }

/* ============ 侧栏 ============ */
.sidebar {
  flex: none; width: 288px;
  display: flex; flex-direction: column;
  border-right: 1px solid var(--border);
  background: var(--bg-soft);
  min-height: 0;
  transition: margin-left .18s ease;
}
body.sidebar-collapsed .sidebar { margin-left: -289px; }
.sidebar-section { display: flex; flex-direction: column; min-height: 0; }
.panel-title {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px 6px;
  font-size: 11.5px; font-weight: 700; letter-spacing: .06em;
  color: var(--muted); text-transform: uppercase; user-select: none;
}
.panel-title .count {
  font-weight: 500; letter-spacing: 0; text-transform: none;
  background: var(--bg-active); color: var(--accent);
  padding: 1px 7px; border-radius: 999px; font-size: 11px;
}
.panel-title-right { display: flex; align-items: center; gap: 6px; }
/* 清除按钮：默认低调，一旦有勾选就变成醒目的红色实心按钮 */
.panel-clear {
  width: 24px; height: 24px; padding: 0; border-radius: 6px;
  border: 1px solid var(--border-strong);
  background: var(--bg); color: var(--muted); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  transition: background .12s, color .12s, border-color .12s, box-shadow .12s;
}
.panel-clear .icon { width: 14px; height: 14px; }
.panel-clear:disabled { opacity: .55; cursor: default; }
.panel-clear:not(:disabled) {
  color: var(--danger); border-color: var(--danger-border); background: var(--danger-bg);
}
.panel-clear:not(:disabled):hover {
  color: #fff; background: var(--danger); border-color: var(--danger);
  box-shadow: 0 1px 6px var(--danger-border);
}
.panel-clear:not(:disabled):active { transform: scale(.94); }
.searchbar { padding: 10px 10px 4px; }
.search-input-wrap { position: relative; display: flex; align-items: center; }
.search-input-wrap .icon { position: absolute; left: 9px; width: 14px; height: 14px; color: var(--muted); pointer-events: none; }
#searchInput {
  width: 100%; height: 32px; padding: 0 28px 0 29px;
  border: 1px solid var(--border-strong); border-radius: 8px;
  background: var(--bg); color: var(--text); font: inherit; font-size: 12.5px; outline: none;
}
#searchInput::placeholder { color: var(--muted); }
#searchInput:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--bg-hover); }
.search-clear {
  position: absolute; right: 4px; width: 22px; height: 22px; padding: 0;
  border: 0; border-radius: 5px; background: transparent; cursor: pointer;
  display: none; align-items: center; justify-content: center; color: var(--muted);
}
.search-clear:hover { background: var(--bg-hover); color: var(--text); }
.search-clear.show { display: inline-flex; }
.search-clear .icon { width: 13px; height: 13px; }

.file-section { flex: 1 1 auto; }
.file-list { flex: 1 1 auto; overflow: auto; padding: 2px 8px 12px; }
.tree-empty { color: var(--muted); font-size: 12.5px; padding: 10px 6px; line-height: 1.7; }
details.tree-dir > summary {
  list-style: none; display: flex; align-items: center; gap: 4px;
  padding: 4px 6px; border-radius: 6px; cursor: pointer; user-select: none;
  color: var(--text-soft); font-size: 13px; font-weight: 500;
}
details.tree-dir > summary::-webkit-details-marker { display: none; }
details.tree-dir > summary:hover { background: var(--bg-hover); color: var(--text); }
details.tree-dir > summary .chevron { width: 13px; height: 13px; color: var(--muted); transition: transform .14s ease; }
details.tree-dir[open] > summary .chevron { transform: rotate(90deg); }
details.tree-dir > summary .icon { color: var(--muted); }
.tree-children { margin-left: 11px; padding-left: 6px; border-left: 1px dashed var(--border-strong); }
.file-item {
  display: flex; align-items: center; gap: 6px; width: 100%;
  padding: 5px 8px; margin: 1px 0;
  border: 0; border-radius: 6px; background: transparent; cursor: pointer;
  color: var(--text-soft); text-align: left; font-size: 13px;
}
.file-item:hover { background: var(--bg-hover); color: var(--text); }
.file-item.active { background: var(--bg-active); color: var(--accent); font-weight: 600; }
.file-item .icon { color: var(--muted); flex: none; }
.file-item.active .icon { color: var(--accent); }
.file-item .fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-item .fdir { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-left: auto; padding-left: 8px; flex: none; }
.file-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

/* 文件选中框 */
.file-icon { display: inline-flex; flex: none; }
.file-check {
  flex: none; width: 15px; height: 15px; border-radius: 4px;
  border: 1.5px solid var(--border-strong); background: var(--bg);
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; transition: background .12s, border-color .12s;
}
.file-check:hover { border-color: var(--accent); }
.file-check .icon { width: 10px; height: 10px; color: #fff; display: none; }
.file-check.on { background: var(--accent); border-color: var(--accent); }
.file-check.on .icon { display: block; }
.file-item.selected { background: var(--bg-hover); }
.file-item.selected .fname { color: var(--text); }
.flat-section { padding: 2px 0; }
.flat-heading { font-size: 11px; color: var(--muted); padding: 8px 8px 3px; font-weight: 600; letter-spacing: .04em; }

.outline-section { flex: 0 1 auto; max-height: 42%; border-top: 1px solid var(--border); }
.outline-section[hidden] { display: none; }
.outline-list { overflow: auto; padding: 0 8px 10px; }
.outline-item {
  display: block; width: 100%; text-align: left;
  border: 0; background: transparent; cursor: pointer;
  color: var(--text-soft); font-size: 12.5px; line-height: 1.5;
  padding: 4px 8px; border-radius: 6px; border-left: 2px solid transparent;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.outline-item:hover { background: var(--bg-hover); color: var(--text); }
.outline-item.active { color: var(--accent); background: var(--bg-hover); border-left-color: var(--accent); font-weight: 600; }
.outline-item .ob { display: inline-block; min-width: 22px; color: var(--muted); font-size: 10.5px; font-family: ui-monospace, Consolas, monospace; }

.sidebar-foot {
  flex: none; padding: 8px 12px; border-top: 1px solid var(--border);
  font-size: 11.5px; color: var(--muted); line-height: 1.6;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sidebar-foot .ver {
  display: inline-block; margin-left: 4px; padding: 0 6px; border-radius: 999px;
  background: var(--bg-active); color: var(--accent);
  font-size: 10.5px; font-weight: 600; letter-spacing: .02em;
}
.sidebar-foot.plain { border-top: 0; padding-top: 0; }

/* ============ 内容区 ============ */
.content-wrap { flex: 1 1 auto; min-width: 0; overflow: auto; position: relative; scroll-behavior: smooth; }
article.markdown-body {
  max-width: 900px; margin: 0 auto;
  padding: 40px 48px 140px;
  font-size: var(--content-font); line-height: 1.75; color: var(--text);
  word-wrap: break-word;
}
article.markdown-body[hidden] { display: none; }
article.markdown-body > :first-child { margin-top: 0 !important; }

.markdown-body h1, .markdown-body h2, .markdown-body h3,
.markdown-body h4, .markdown-body h5, .markdown-body h6 {
  margin: 1.6em 0 .65em; font-weight: 650; line-height: 1.3; scroll-margin-top: 20px; position: relative;
}
.markdown-body h1 { font-size: 2em; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
.markdown-body h2 { font-size: 1.5em; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
.markdown-body h3 { font-size: 1.22em; }
.markdown-body h4 { font-size: 1.05em; }
.markdown-body h5 { font-size: .95em; }
.markdown-body h6 { font-size: .9em; color: var(--muted); }
.markdown-body h1:hover .anchor, .markdown-body h2:hover .anchor,
.markdown-body h3:hover .anchor, .markdown-body h4:hover .anchor,
.markdown-body h5:hover .anchor, .markdown-body h6:hover .anchor { opacity: 1; }
.markdown-body .anchor {
  position: absolute; left: -20px; top: .15em; opacity: 0;
  color: var(--muted); text-decoration: none; font-size: .8em; transition: opacity .12s;
}
.markdown-body p { margin: 0 0 1em; }
.markdown-body a { color: var(--accent); text-decoration: none; }
.markdown-body a:hover { text-decoration: underline; text-underline-offset: 2px; }
.markdown-body a.doc-link { border-bottom: 1px dashed var(--accent); }
.markdown-body strong { font-weight: 650; }
.markdown-body em { font-style: italic; }
.markdown-body del { color: var(--muted); }
.markdown-body mark { background: var(--mark); color: inherit; padding: .1em .2em; border-radius: 3px; }
.markdown-body ul, .markdown-body ol { margin: 0 0 1em; padding-left: 1.9em; }
.markdown-body li + li { margin-top: .28em; }
.markdown-body li > p { margin: .35em 0; }
.markdown-body li > ul, .markdown-body li > ol { margin: .35em 0 0; }
.markdown-body ul.task-list { padding-left: .4em; }
.markdown-body li.task-list-item { list-style: none; }
.markdown-body li.task-list-item input[type="checkbox"] {
  margin: 0 .55em 0 0; vertical-align: -1px; width: 14px; height: 14px; accent-color: var(--accent);
}
.markdown-body blockquote {
  margin: 0 0 1em; padding: .55em 1.1em;
  border-left: 4px solid var(--border-strong); border-radius: 0 8px 8px 0;
  background: var(--quote-bg); color: var(--text-soft);
}
.markdown-body blockquote > :last-child { margin-bottom: 0; }
.markdown-body hr { height: 1px; margin: 2em 0; border: 0; background: var(--border); }
.markdown-body img {
  max-width: 100%; height: auto; border-radius: 8px; vertical-align: middle;
  box-shadow: 0 1px 3px rgba(0,0,0,.08);
}
.markdown-body img.img-missing {
  display: inline-block; min-width: 120px; min-height: 28px; padding: 6px;
  border: 1px dashed var(--border-strong); background: var(--code-bg); box-shadow: none;
  font-size: 12px; color: var(--muted);
}
.markdown-body img.zoomable { cursor: zoom-in; transition: opacity .15s; }
.markdown-body img.zoomable:hover { opacity: .88; }
.markdown-body code {
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Liberation Mono", Menlo, monospace;
  font-size: .875em; padding: .18em .4em; border-radius: 5px;
  background: var(--inline-code-bg);
}
.markdown-body pre {
  position: relative; margin: 0 0 1.2em; padding: 14px 16px;
  background: var(--code-bg); border: 1px solid var(--code-border); border-radius: 10px;
  overflow: auto; line-height: 1.6;
}
.markdown-body pre code {
  padding: 0; background: none; font-size: .875em; white-space: pre; border-radius: 0;
}
.markdown-body pre code.hljs { padding: 0; background: transparent; }
.markdown-body .code-copy {
  position: absolute; top: 7px; right: 7px; z-index: 2;
  height: 24px; padding: 0 10px; font-size: 11.5px; cursor: pointer;
  color: var(--text-soft); background: var(--bg-elev);
  border: 1px solid var(--border); border-radius: 6px;
  opacity: 0; transition: opacity .12s, color .12s, border-color .12s;
}
.markdown-body pre:hover .code-copy, .markdown-body .code-copy:focus-visible { opacity: 1; }
.markdown-body .code-copy:hover { color: var(--accent); border-color: var(--accent); }
.markdown-body .code-copy.done { color: var(--accent); border-color: var(--accent); }
.markdown-body .code-lang {
  position: absolute; top: 9px; right: 12px; z-index: 1;
  font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); pointer-events: none; user-select: none;
}
.markdown-body pre:hover .code-lang { opacity: 0; }
.markdown-body .table-wrap { overflow-x: auto; margin: 0 0 1.2em; border: 1px solid var(--border); border-radius: 10px; }
.markdown-body table { border-collapse: collapse; width: 100%; font-size: .95em; }
.markdown-body th, .markdown-body td { padding: 8px 13px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
/* marked 用 align 属性表达表格对齐（|:--|:-:|--:|），
   上面的 text-align:left 会盖掉它，这里按属性选择器补回来 */
.markdown-body th[align="left"], .markdown-body td[align="left"] { text-align: left; }
.markdown-body th[align="center"], .markdown-body td[align="center"] { text-align: center; }
.markdown-body th[align="right"], .markdown-body td[align="right"] { text-align: right; }
.markdown-body th { background: var(--bg-soft); font-weight: 650; white-space: nowrap; }
.markdown-body tr:last-child td { border-bottom: 0; }
.markdown-body tbody tr:nth-child(2n) { background: var(--bg-soft); }
.markdown-body tbody tr:hover { background: var(--bg-hover); }
.markdown-body kbd {
  font-family: ui-monospace, Consolas, monospace; font-size: .8em;
  padding: 2px 6px; border: 1px solid var(--border-strong); border-bottom-width: 2px;
  border-radius: 5px; background: var(--bg-soft);
}
.markdown-body sup { font-size: .75em; }
.markdown-body .footnote { font-size: .9em; color: var(--text-soft); }
.markdown-body input[type="checkbox"] { cursor: default; }

/* 代码高亮配色 */
.hljs-comment, .hljs-quote { color: var(--hl-comment); font-style: italic; }
.hljs-keyword, .hljs-selector-tag, .hljs-doctag { color: var(--hl-keyword); }
.hljs-string, .hljs-regexp, .hljs-link, .hljs-template-string { color: var(--hl-string); }
.hljs-number, .hljs-literal, .hljs-variable, .hljs-template-variable, .hljs-params { color: var(--hl-number); }
.hljs-title, .hljs-title.function_, .hljs-function .hljs-title, .hljs-section { color: var(--hl-title); }
.hljs-attr, .hljs-attribute, .hljs-property, .hljs-selector-attr, .hljs-selector-pseudo { color: var(--hl-attr); }
.hljs-built_in, .hljs-symbol, .hljs-bullet, .hljs-code { color: var(--hl-builtin); }
.hljs-type, .hljs-class .hljs-title, .hljs-title.class_ { color: var(--hl-type); }
.hljs-meta, .hljs-meta .hljs-keyword, .hljs-comment.hljs-doctag { color: var(--hl-meta); }
.hljs-tag, .hljs-name, .hljs-selector-class, .hljs-selector-id, .hljs-selector-tag { color: var(--hl-tag); }
.hljs-addition { color: var(--hl-addition); background: var(--hl-addition-bg); }
.hljs-deletion { color: var(--hl-deletion); background: var(--hl-deletion-bg); }
.hljs-emphasis { font-style: italic; }
.hljs-strong { font-weight: 700; }

/* ============ 源码视图 ============ */
#sourceView {
  display: none; width: 100%; height: 100%; margin: 0; padding: 28px 32px 60px;
  border: 0; outline: none; resize: none; background: var(--bg); color: var(--text);
  font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
  font-size: 13px; line-height: 1.7; white-space: pre; overflow: auto;
}
#sourceView[hidden] { display: none !important; }
body.source-mode #sourceView { display: block; }
body.source-mode article.markdown-body { display: none; }

/* ============ 空状态（无可见 UI，仅作双击接收区） ============ */
#emptyState {
  display: block; min-height: 100%;
  padding: 40px 24px;
  touch-action: manipulation; /* 触屏双击不触发页面缩放 */
}
#emptyState[hidden] { display: none !important; }

/* ============ 拖放遮罩 / 提示 ============ */
#dropOverlay {
  position: fixed; inset: 0; z-index: 100; display: none;
  align-items: center; justify-content: center;
  background: rgba(9, 105, 218, .12); backdrop-filter: blur(3px);
}
#dropOverlay.show { display: flex; }
.drop-box {
  padding: 30px 44px; border-radius: 18px; text-align: center;
  background: var(--bg-elev); border: 2px dashed var(--accent);
  box-shadow: var(--shadow); color: var(--text); font-size: 16px; font-weight: 600;
}
.drop-box small { display: block; margin-top: 6px; font-weight: 400; font-size: 12.5px; color: var(--muted); }

#toast {
  position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 16px);
  z-index: 200; padding: 10px 18px; border-radius: 10px;
  background: #1f2328; color: #fff; font-size: 13px;
  box-shadow: var(--shadow); opacity: 0; pointer-events: none;
  transition: opacity .18s, transform .18s; max-width: 80vw;
}
html[data-theme="dark"] #toast { background: #e6edf3; color: #0d1117; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

#backTop {
  position: fixed; right: 26px; bottom: 26px; z-index: 40;
  width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid var(--border-strong); background: var(--bg-elev);
  color: var(--text-soft); cursor: pointer; display: none;
  align-items: center; justify-content: center; box-shadow: var(--shadow);
}
#backTop.show { display: flex; }
#backTop:hover { color: var(--accent); border-color: var(--accent); }

/* ============ 图片灯箱 / 错误提示 ============ */
.lightbox {
  position: fixed; inset: 0; z-index: 300; display: flex;
  flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  background: rgba(0, 0, 0, .82); padding: 30px; cursor: zoom-out;
}
.lightbox img { max-width: 94vw; max-height: 84vh; border-radius: 8px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.lightbox-cap { color: #e6edf3; font-size: 13px; }

.markdown-body .render-error {
  border: 1px solid #d1242f; border-radius: 10px; padding: 14px 16px;
  background: rgba(209, 36, 47, .07); color: var(--text);
}
.markdown-body .render-error pre { margin: 10px 0 0; }

/* ============ 响应式 ============ */
@media (max-width: 860px) {
  .sidebar {
    position: absolute; left: 0; top: 0; bottom: 0; z-index: 20;
    box-shadow: var(--shadow); transform: translateX(-102%);
    transition: transform .2s ease;
  }
  body.sidebar-open .sidebar { transform: translateX(0); }
  .sidebar-backdrop {
    position: absolute; inset: 0; z-index: 15; background: rgba(0,0,0,.32);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  body.sidebar-open .sidebar-backdrop { opacity: 1; pointer-events: auto; }
  article.markdown-body { padding: 24px 18px 110px; }
  .tb-btn { width: 34px; padding: 0; justify-content: center; }
  .doc-title .path { display: none; }
  #sourceView { padding: 18px; }
  .outline-section { max-height: 34%; }
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="tb-btn icon-only" id="btnMenu" title="显示/隐藏侧栏" aria-label="显示/隐藏侧栏"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    <div class="doc-title">
      <div class="name" id="docName">MD Look</div>
      <div class="path" id="docPath">在本地浏览器中阅读 Markdown</div>
    </div>
    <div class="toolbar-group">
      <button class="tb-btn icon-only zoom" id="btnFontDown" title="缩小字号" aria-label="缩小字号">A−</button>
      <button class="tb-btn icon-only zoom" id="btnFontUp" title="放大字号" aria-label="放大字号">A+</button>
      <button class="tb-btn icon-only" id="btnFontReset" title="重置字号" aria-label="重置字号">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.64-6.36"/><path d="M3 4v5h5"/></svg>
      </button>
    </div>
    <div class="toolbar-group">
      <button class="tb-btn icon-only" id="btnSource" title="切换源码视图">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg>
      </button>
      <button class="tb-btn icon-only" id="btnCopy" title="复制 Markdown 原文" disabled>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </button>
    </div>
    <div class="progress" id="progress"></div>
  </header>

  <div class="main">
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <aside class="sidebar" id="sidebar">
      <div class="searchbar">
        <div class="search-input-wrap">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="searchInput" type="search" placeholder="筛选文件（按 / 聚焦）" autocomplete="off" spellcheck="false">
          <button class="search-clear" id="searchClear" title="清空"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>
      </div>
      <div class="sidebar-section file-section">
        <div class="panel-title">
          <span>文件</span>
          <span class="panel-title-right">
            <span class="count" id="fileCount">0</span>
            <button class="panel-clear" id="btnClearFiles" title="清除选中的文件" aria-label="清除选中的文件" disabled>
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
            </button>
          </span>
        </div>
        <nav class="file-list" id="fileList"></nav>
      </div>
      <div class="sidebar-section outline-section" id="outlineSection" hidden>
        <div class="panel-title"><span>大纲</span></div>
        <nav class="outline-list" id="outlineList"></nav>
      </div>
      <div class="sidebar-foot" id="docMeta">全部在本地浏览器中完成 · 不上传任何文件</div>
      <div class="sidebar-foot plain" id="appFoot">MD Look<span class="ver" id="appVersion">v1.2.0</span></div>
    </aside>

    <div class="content-wrap" id="contentWrap">
      <div id="emptyState" title="双击打开 Markdown 文件"></div>
      <article class="markdown-body" id="content" hidden></article>
      <textarea id="sourceView" readonly spellcheck="false" hidden></textarea>
    </div>
  </div>
</div>

<div id="dropOverlay"><div class="drop-box">松开鼠标即可打开<small>支持 .md 文件、多个文件或整个文件夹</small></div></div>
<div id="toast"></div>
<button id="backTop" title="回到顶部"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>

<input type="file" id="fileInput" accept=".md,.markdown,.mdown,.mkd,.mdx,.txt,text/markdown,text/plain" multiple hidden>
<input type="file" id="dirInput" webkitdirectory directory multiple hidden>

<script>
/* =====================================================================
   MD Look —— 单文件离线 Markdown 查看器
   全部逻辑在本地浏览器运行，不联网、不上传。
   ===================================================================== */
(function () {
  'use strict';

  /* ---------------- 工具 ---------------- */
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.prototype.slice.call((root || document).querySelectorAll(sel));
  const MD_RE = /\.(md|markdown|mdown|mkd|mdx|txt)$/i;
  const IMG_RE = /\.(png|jpe?g|gif|webp|avif|bmp|svg|ico)$/i;
  const PREF_KEY = 'mdv:prefs:v1';

  function escHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function prettySize(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(n < 10240 ? 1 : 0) + ' KB';
    return (n / 1024 / 1024).toFixed(1) + ' MB';
  }
  function dirname(p) {
    const i = p.lastIndexOf('/');
    return i < 0 ? '' : p.slice(0, i);
  }
  function basename(p) {
    const i = p.lastIndexOf('/');
    return i < 0 ? p : p.slice(i + 1);
  }
  /** 以 base 目录为基准解析相对路径，处理 ./ 与 ../ */
  function joinPath(base, rel) {
    const raw = String(rel).replace(/\\/g, '/');
    const parts = (base ? String(base).split('/') : []).concat(raw.split('/'));
    const out = [];
    for (const p of parts) {
      if (!p || p === '.') continue;
      if (p === '..') { out.pop(); continue; }
      out.push(p);
    }
    return out.join('/');
  }
  function safeDecode(s) {
    try { return decodeURIComponent(s); } catch (e) { return s; }
  }
  function toast(msg, ms) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove('show'), ms || 2200);
  }

  /* ---------------- 偏好 ---------------- */
  const FONT_MIN = 13;
  const FONT_DEFAULT = 16;
  const FONT_MAX = 22;

  const prefs = {
    fontSize: FONT_DEFAULT,
    sidebar: true,
    view: 'preview'
  };
  function loadPrefs() {
    try {
      const raw = localStorage.getItem(PREF_KEY);
      if (raw) Object.assign(prefs, JSON.parse(raw));
    } catch (e) { /* file:// 下可能被禁用 */ }
    delete prefs.theme; // 深浅色改为跟随系统，清掉旧版本残留值
    prefs.fontSize = clampFont(prefs.fontSize);
    prefs.sidebar = prefs.sidebar !== false;
    prefs.view = prefs.view === 'source' ? 'source' : 'preview';
  }
  function clampFont(v) {
    const n = Math.round(Number(v));
    if (!isFinite(n)) return FONT_DEFAULT;
    return Math.min(FONT_MAX, Math.max(FONT_MIN, n));
  }
  function savePrefs() {
    try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) { /* ignore */ }
  }

  /* ---------------- 应用状态 ---------------- */
  const state = {
    docs: [],                    // {key, rel, name, file}
    docMap: new Map(),           // key -> doc
    assets: new Map(),           // 小写相对路径 -> File
    assetBase: new Map(),        // 小写 basename -> [File,...]
    urls: new Map(),             // 小写路径 -> blob url
    current: null,
    headings: [],
    query: '',
    selected: new Set(),         // 已勾选的文件 key
    scrollMemory: new Map()
  };

  /* ---------------- 预处理：清理不可信 HTML ---------------- */
  const DROP_TAGS = new Set(['script', 'style', 'iframe', 'frame', 'frameset', 'object', 'embed',
    'applet', 'form', 'textarea', 'select', 'button', 'link', 'meta', 'base', 'noscript',
    'template', 'svg', 'math', 'audio', 'video', 'source', 'track', 'canvas', 'dialog']);
  const KEEP_TAGS = new Set(['a', 'p', 'div', 'span', 'br', 'hr', 'em', 'strong', 'b', 'i', 'u', 's',
    'del', 'ins', 'mark', 'small', 'sub', 'sup', 'code', 'pre', 'kbd', 'samp', 'var', 'blockquote',
    'ul', 'ol', 'li', 'dl', 'dt', 'dd', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'table', 'thead',
    'tbody', 'tfoot', 'tr', 'th', 'td', 'caption', 'colgroup', 'col', 'img', 'figure', 'figcaption',
    'input', 'label', 'details', 'summary', 'abbr', 'time', 'cite', 'q', 'ruby', 'rt', 'rp']);

  function sanitize(root) {
    const walk = (node) => {
      const children = Array.prototype.slice.call(node.childNodes);
      for (const child of children) {
        if (child.nodeType === 8) { child.remove(); continue; }
        if (child.nodeType !== 1) continue;
        const tag = child.tagName.toLowerCase();

        if (DROP_TAGS.has(tag)) { child.remove(); continue; }
        if (!KEEP_TAGS.has(tag)) {
          // 未知标签：解包，保留其中的文字/图片
          const parent = child.parentNode;
          while (child.firstChild) parent.insertBefore(child.firstChild, child);
          child.remove();
          continue;
        }

        const attrs = Array.prototype.slice.call(child.attributes);
        for (const attr of attrs) {
          const name = attr.name.toLowerCase();
          const val = attr.value;
          if (name.indexOf('on') === 0 || name === 'srcdoc' || name === 'formaction' || name === 'xlink:href') {
            child.removeAttribute(attr.name);
            continue;
          }
          if (name === 'href' || name === 'src' || name === 'action' || name === 'poster') {
            if (/^\s*(javascript|vbscript|data:text\/html)/i.test(val)) child.removeAttribute(attr.name);
          }
          if (name === 'style') {
            if (/expression\s*\(|javascript:|url\s*\(\s*['"]?\s*javascript/i.test(val)) child.removeAttribute(attr.name);
          }
        }

        if (tag === 'input') {
          const type = (child.getAttribute('type') || '').toLowerCase();
          if (type !== 'checkbox') { child.remove(); continue; }
          child.setAttribute('disabled', '');
          child.removeAttribute('name');
          child.removeAttribute('value');
        }
        walk(child);
      }
    };
    walk(root);
  }

  /* ---------------- Markdown 渲染 ---------------- */
  function configureMarked() {
    if (!window.marked) return;
    window.marked.setOptions({
      gfm: true,
      breaks: false,
      pedantic: false,
      smartypants: false,
      xhtml: false
    });
  }

  function renderMarkdown(text, doc) {
    const article = $('#content');
    const t0 = performance.now();
    let html;
    try {
      html = window.marked ? window.marked.parse(text) : '<pre>' + escHtml(text) + '</pre>';
    } catch (err) {
      html = '<div class="render-error"><strong>Markdown 解析失败</strong><pre>' + escHtml(String(err && err.message || err)) + '</pre></div>';
    }
    article.innerHTML = html;
    sanitize(article);

    // 表格横向滚动容器
    $$('table', article).forEach(tbl => {
      const wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      tbl.parentNode.insertBefore(wrap, tbl);
      wrap.appendChild(tbl);
    });

    // 图片相对路径 -> blob URL
    resolveImages(article, doc);

    // 代码块：语言标签 + 复制按钮 + 高亮
    decorateCodeBlocks(article);

    // 标题 id + 锚点
    state.headings = buildHeadingAnchors(article);

    // 链接处理（文档间跳转 / 外链 / 锚点）
    bindLinks(article, doc);

    // 任务列表样式（每篇里可能有好几个）
    $$('li', article).forEach(li => {
      if (li.querySelector(':scope > input[type="checkbox"]')) li.classList.add('task-list-item');
    });
    $$('ul', article).forEach(ul => {
      if (ul.querySelector(':scope > li > input[type="checkbox"]')) ul.classList.add('task-list');
    });

    return performance.now() - t0;
  }

  function decorateCodeBlocks(article) {
    const blocks = $$('pre', article);
    const canHighlight = !!(window.hljs && typeof window.hljs.highlight === 'function');
    blocks.forEach(pre => {
      const code = pre.querySelector('code');
      if (!code) return;
      const cls = code.className || '';
      const m = /(?:^|\s)language-([\w+#.-]+)/.exec(cls);

      if (canHighlight && m) {
        const lang = m[1].toLowerCase();
        const src = code.textContent;
        if (src.length > 0 && src.length <= 200000) {
          try {
            const res = window.hljs.highlight(src, { language: lang, ignoreIllegals: true });
            code.innerHTML = res.value;
            code.classList.add('hljs');
          } catch (e) {
            try {
              const res2 = window.hljs.highlightAuto(src);
              code.innerHTML = res2.value;
              code.classList.add('hljs');
            } catch (e2) { /* 保持原样 */ }
          }
        }
      }

      const langLabel = document.createElement('span');
      langLabel.className = 'code-lang';
      langLabel.textContent = m ? m[1] : 'CODE';
      pre.appendChild(langLabel);

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'code-copy';
      btn.textContent = '复制';
      btn.title = '复制代码';
      btn.addEventListener('click', () => {
        copyText(code.textContent).then(() => {
          btn.textContent = '已复制';
          btn.classList.add('done');
          setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('done'); }, 1500);
        });
      });
      pre.appendChild(btn);
    });
  }

  // 图片点击放大：远程图片、data:、以及本地 blob 图片都挂上
  function attachZoom(img, name) {
    img.classList.add('zoomable');
    if (!img.title) img.title = '点击放大';
    img.addEventListener('click', () => showImageLightbox(img.currentSrc || img.src, name || img.alt || '图片'));
  }

  function resolveImages(article, doc) {
    let missCount = 0;
    $$('img', article).forEach(img => {
      const raw = (img.getAttribute('src') || '').trim();
      if (!raw) return;
      if (/^(https?:|data:|blob:)/i.test(raw)) {
        attachZoom(img, img.alt || '图片');
        return;
      }
      const resolved = lookupAsset(doc, raw);
      if (resolved) {
        img.src = assetUrl(resolved);
        img.dataset.originalSrc = raw;
        img.loading = 'lazy';
        attachZoom(img, basename(raw) || img.alt || '图片');
      } else {
        missCount++;
        const span = document.createElement('span');
        span.className = 'img-missing';
        span.title = '找不到图片：' + raw;
        span.textContent = '图片未找到：' + raw + (img.alt ? '（' + img.alt + '）' : '');
        img.replaceWith(span);
      }
    });
    if (missCount && !resolveImages._warned) {
      resolveImages._warned = true;
      toast('有 ' + missCount + ' 张相对路径图片未找到，用「打开文件夹」载入整个目录即可显示', 4200);
    }
    if (!missCount) resolveImages._warned = false;
  }

  function lookupAsset(doc, src) {
    let p = src.split('#')[0].split('?')[0];
    p = safeDecode(p);
    if (!p) return null;
    if (p.charAt(0) === '/') {
      // 绝对路径：在已打开的目录树里按相对路径兜底查找
      p = p.replace(/^\/+/, '');
      if (state.assets.has(p.toLowerCase())) return state.assets.get(p.toLowerCase());
      return null;
    }
    const abs = joinPath(dirname(doc.rel), p);
    const hit = state.assets.get(abs.toLowerCase());
    if (hit) return hit;
    // 兜底：按文件名匹配
    const list = state.assetBase.get(basename(p).toLowerCase());
    if (list && list.length === 1) return list[0];
    if (list && list.length > 1) {
      const sameDir = list.find(f => joinPath(dirname(doc.rel), p).toLowerCase().split('/').slice(0, -1).join('/') === f._relLower.split('/').slice(0, -1).join('/'));
      if (sameDir) return sameDir;
    }
    return null;
  }

  function assetUrl(file) {
    const k = (file._relLower || file.name);
    if (state.urls.has(k)) return state.urls.get(k);
    const url = URL.createObjectURL(file);
    state.urls.set(k, url);
    return url;
  }

  function buildHeadingAnchors(article) {
    const used = new Set();
    const list = [];
    $$('h1, h2, h3, h4, h5, h6', article).forEach(h => {
      const text = (h.textContent || '').trim();
      let base = text.toLowerCase()
        .replace(/<[^>]*>/g, '')
        .replace(/[^\w\u3400-\u9fff\uac00-\ud7af-]+/g, '-')
        .replace(/^-+|-+$/g, '');
      if (!base) base = 'section';
      // 生成唯一 id：既要避开本文其它标题，也要避开页面自身的 id（如 content / fileList）
      let id = base, n = 1;
      while (used.has(id) || (document.getElementById(id) && document.getElementById(id) !== h)) {
        id = base + '-' + (n++);
      }
      used.add(id);
      h.id = id;
      const lvl = Number(h.tagName.charAt(1));
      list.push({ id, text, level: lvl });

      const a = document.createElement('a');
      a.className = 'anchor';
      a.href = '#' + id;
      a.textContent = '#';
      a.title = '复制此标题的链接';
      a.addEventListener('click', ev => {
        ev.preventDefault();
        const url = location.href.split('#')[0] + '#' + id;
        copyText(url).then(() => toast('已复制标题链接'));
      });
      h.insertBefore(a, h.firstChild);
    });
    return list;
  }

  function bindLinks(article, doc) {
    $$('a', article).forEach(a => {
      const raw = a.getAttribute('href');
      if (!raw) return;
      if (raw.charAt(0) === '#') {
        a.addEventListener('click', ev => {
          ev.preventDefault();
          const target = document.getElementById(raw.slice(1));
          if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        return;
      }
      if (/^(https?:|mailto:)/i.test(raw)) {
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        return;
      }
      if (/^(javascript|vbscript):/i.test(raw)) { a.removeAttribute('href'); return; }
      // 相对链接：可能指向另一篇 md，也可能是本地文件
      const clean = safeDecode(raw.split('#')[0]);
      const targetRel = clean.charAt(0) === '/'
        ? clean.replace(/^\/+/, '')
        : joinPath(dirname(doc.rel), clean);
      const hitDoc = state.docs.find(d => d.rel.toLowerCase() === targetRel.toLowerCase());
      if (hitDoc) {
        a.classList.add('doc-link');
        a.title = '打开：' + hitDoc.rel;
        a.addEventListener('click', ev => {
          ev.preventDefault();
          openDoc(hitDoc.key);
        });
        return;
      }
      const hitAsset = state.assets.get(targetRel.toLowerCase());
      if (hitAsset && IMG_RE.test(hitAsset.name)) {
        a.classList.add('doc-link');
        a.title = '查看图片：' + hitAsset.name;
        a.addEventListener('click', ev => {
          ev.preventDefault();
          showImageLightbox(assetUrl(hitAsset), hitAsset.name);
        });
        return;
      }
      // 其它相对链接：不做默认跳转，避免 file:// 下打开未知文件
      a.addEventListener('click', ev => {
        ev.preventDefault();
        toast('本地链接：' + raw + '（未在已打开的文件中找到）');
      });
    });
  }

  function showImageLightbox(url, name) {
    const mask = document.createElement('div');
    mask.className = 'lightbox';
    const img = document.createElement('img');
    img.src = url;
    img.alt = name;
    const cap = document.createElement('div');
    cap.className = 'lightbox-cap';
    cap.textContent = name + '（点击任意处关闭）';
    mask.appendChild(img);
    mask.appendChild(cap);

    // 关闭时一定要摘掉 keydown 监听，否则反复开关会越积越多
    function close() {
      document.removeEventListener('keydown', onKey);
      mask.remove();
    }
    function onKey(ev) { if (ev.key === 'Escape') close(); }
    mask.addEventListener('click', close);
    document.addEventListener('keydown', onKey);
    document.body.appendChild(mask);
  }

  /* ---------------- 文件装载 ---------------- */
  let docSeq = 0;   // 文档 key 的单调递增序号，删除文件后也不会重复
  let openToken = 0; // 防止快速连续打开时，慢的那次覆盖掉最新内容

  function isMarkdownFile(f) {
    return MD_RE.test(f.name);
  }

  function resetLibrary() {
    state.docs = [];
    state.docMap.clear();
    state.assets.clear();
    state.assetBase.clear();
    state.selected.clear();
    state.scrollMemory.clear();
    state.urls.forEach(u => { try { URL.revokeObjectURL(u); } catch (e) { /* ignore */ } });
    state.urls.clear();
    state.current = null;
  }

  /* ---------------- 选中 & 按选中删除 ---------------- */
  function updateClearBtn() {
    const btn = $('#btnClearFiles');
    if (!btn) return;
    const n = state.selected.size;
    btn.disabled = n === 0;
    const label = n ? ('清除选中的 ' + n + ' 个文件') : '清除选中的文件';
    btn.title = label;
    btn.setAttribute('aria-label', label);
  }

  function toggleSelect(key) {
    if (state.selected.has(key)) state.selected.delete(key);
    else state.selected.add(key);
    syncSelectUI();
    updateClearBtn();
  }

  function syncSelectUI() {
    $$('#fileList .file-item').forEach(el => {
      const on = state.selected.has(el.dataset.key);
      el.classList.toggle('selected', on);
      const box = el.querySelector('.file-check');
      if (box) {
        box.classList.toggle('on', on);
        box.setAttribute('aria-checked', on ? 'true' : 'false');
      }
    });
  }

  // 从库里移除单个文档（含它的资源映射与 blob url）
  function removeDoc(key) {
    const idx = state.docs.findIndex(d => d.key === key);
    if (idx < 0) return null;
    const doc = state.docs[idx];
    state.docs.splice(idx, 1);
    state.docMap.delete(key);
    state.selected.delete(key);
    state.scrollMemory.delete(key);

    // 同一目录下的其它文档还会用到同样的相对图片（pic.png 之类），
    // 这时候不能清资源映射，也不能 revoke blob url，否则别的文档图片就裂了。
    // 目录里已经没有别的文档了，才安全地回收。
    const dir = dirname(doc.rel).toLowerCase();
    const stillUsed = state.docs.some(d => dirname(d.rel).toLowerCase() === dir);
    if (!stillUsed) {
      const low = doc.rel.toLowerCase();
      const url = state.urls.get(low);
      if (url) { try { URL.revokeObjectURL(url); } catch (e) { /* ignore */ } state.urls.delete(low); }
      state.assets.delete(low);
      const bn = basename(low);
      const arr = state.assetBase.get(bn);
      if (arr) {
        const next = arr.filter(f => f !== doc.file);
        if (next.length) state.assetBase.set(bn, next);
        else state.assetBase.delete(bn);
      }
    }
    return doc;
  }

  // 侧栏「清除」按钮：只删掉已勾选的文件
  function clearSelected() {
    const keys = Array.from(state.selected);
    if (!keys.length) { toast('请先勾选要清除的文件'); return; }

    const curRemoved = !!state.current && keys.indexOf(state.current) >= 0;
    keys.forEach(removeDoc);

    if (curRemoved) {
      $('#content').innerHTML = '';
      $('#sourceView').value = '';
      // 只改界面，不动用户记住的「源码/预览」偏好
      applySourceMode(false);
      state.current = null;
    }

    refreshLibraryUI();

    if (!state.docs.length) {
      // 一篇文档都不剩了，图片等资源的映射和 blob url 也一并回收
      state.assets.clear();
      state.assetBase.clear();
      state.urls.forEach(u => { try { URL.revokeObjectURL(u); } catch (e) { /* ignore */ } });
      state.urls.clear();
    }

    if (curRemoved) {
      if (state.docs.length) openDoc(state.docs[0].key);
      else document.title = 'MD Look';
    }
    toast('已清除 ' + keys.length + ' 个文件');
  }

  function addFiles(fileList) {
    const files = Array.prototype.slice.call(fileList);
    const added = [];
    const requested = [];
    if (!files.length) return { added, requested };

    const bySig = new Map(state.docs.map(d => [d.sig, d]));

    for (const file of files) {
      const rel = (file._relOverride
        || (file.webkitRelativePath && file.webkitRelativePath.length && file.webkitRelativePath)
        || file.name || '').replace(/\\/g, '/');
      if (!rel) continue;

      // 所有文件都可以作为资源（图片、附件）
      const low = rel.toLowerCase();
      state.assets.set(low, file);
      file._relLower = low;
      const bn = basename(low);
      let bucket = state.assetBase.get(bn);
      if (!bucket) { bucket = []; state.assetBase.set(bn, bucket); }
      // 同一个文件重复载入时不要重复入桶
      if (bucket.indexOf(file) < 0) bucket.push(file);

      if (!isMarkdownFile(file)) continue;

      const sig = rel + '|' + file.size + '|' + (file.lastModified || 0);
      const exist = bySig.get(sig);
      if (exist) { requested.push(exist); continue; }

      // key 只在本次会话内唯一即可；用单调递增计数器，避免删除后重新加回时撞 key
      const key = rel.toLowerCase() + '|' + (docSeq++);
      const doc = { key, sig, rel, name: file.name, file };
      state.docs.push(doc);
      state.docMap.set(key, doc);
      bySig.set(sig, doc);
      added.push(doc);
      requested.push(doc);
    }

    state.docs.sort((a, b) => a.rel.localeCompare(b.rel, 'zh-Hans-CN', { numeric: true, sensitivity: 'base' }));
    return { added, requested };
  }

  function refreshLibraryUI() {
    renderFileList();
    $('#fileCount').textContent = String(state.docs.length);
    updateClearBtn();
    if (!state.docs.length) {
      $('#docName').textContent = 'MD Look';
      $('#docPath').textContent = '在本地浏览器中阅读 Markdown';
      $('#docMeta').textContent = '全部在本地浏览器中完成 · 不上传任何文件';
      $('#content').innerHTML = '';
      $('#content').hidden = true;
      $('#emptyState').hidden = false;
      state.headings = [];
      renderOutline();
      $('#btnCopy').disabled = true;
      state.current = null;
      document.title = 'MD Look';
    }
  }

  /* ---------------- 文件列表 ---------------- */
  function renderFileList() {
    const nav = $('#fileList');
    nav.innerHTML = '';

    if (!state.docs.length) {
      nav.innerHTML = '';
      return;
    }

    if (state.query) {
      renderFlatList(nav);
      return;
    }

    const tree = { dirs: new Map(), files: [] };
    for (const d of state.docs) {
      const parts = d.rel.split('/');
      let node = tree;
      for (let i = 0; i < parts.length - 1; i++) {
        const name = parts[i];
        if (!node.dirs.has(name)) node.dirs.set(name, { dirs: new Map(), files: [] });
        node = node.dirs.get(name);
      }
      node.files.push(d);
    }

    const frag = document.createDocumentFragment();
    appendTreeNode(frag, tree, 0);
    nav.appendChild(frag);
    highlightCurrent();
    syncSelectUI();
  }

  function appendTreeNode(container, node, depth) {
    const dirs = Array.from(node.dirs.keys()).sort((a, b) => a.localeCompare(b, 'zh-Hans-CN', { numeric: true }));
    for (const name of dirs) {
      const child = node.dirs.get(name);
      const details = document.createElement('details');
      details.className = 'tree-dir';
      if (depth < 1) details.open = true;
      const summary = document.createElement('summary');
      summary.innerHTML = '<svg class="icon chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>' +
        '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
      const span = document.createElement('span');
      span.className = 'fname';
      span.textContent = name;
      summary.appendChild(span);
      // 统计子项数量
      let count = 0;
      (function countAll(n) {
        count += n.files.length;
        n.dirs.forEach(c => countAll(c));
      })(child);
      const badge = document.createElement('span');
      badge.className = 'fdir';
      badge.textContent = String(count);
      summary.appendChild(badge);
      details.appendChild(summary);

      const box = document.createElement('div');
      box.className = 'tree-children';
      appendTreeNode(box, child, depth + 1);
      details.appendChild(box);
      container.appendChild(details);
    }

    const files = node.files.slice().sort((a, b) => a.name.localeCompare(b.name, 'zh-Hans-CN', { numeric: true }));
    for (const d of files) {
      container.appendChild(fileItemEl(d));
    }
  }

  function fileItemEl(d) {
    // 用 div[role=button] 而不是 <button>：里面还要嵌一个 role=checkbox 的勾选框，
    // 真实 <button> 里套交互元素是非法结构，屏幕阅读器会读错。
    const row = document.createElement('div');
    row.className = 'file-item';
    row.dataset.key = d.key;
    row.title = d.rel;
    row.setAttribute('role', 'button');
    row.setAttribute('tabindex', '0');

    // 勾选框：只切换选中，不打开文档
    const check = document.createElement('span');
    check.className = 'file-check';
    check.setAttribute('role', 'checkbox');
    check.setAttribute('aria-checked', 'false');
    check.setAttribute('aria-label', '选择 ' + d.name);
    check.innerHTML = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
    check.addEventListener('click', ev => {
      ev.preventDefault();
      ev.stopPropagation();
      toggleSelect(d.key);
    });
    row.appendChild(check);

    const icon = document.createElement('span');
    icon.className = 'file-icon';
    icon.innerHTML = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>';
    row.appendChild(icon);

    const span = document.createElement('span');
    span.className = 'fname';
    span.textContent = d.name;
    row.appendChild(span);

    row.addEventListener('click', ev => {
      // Ctrl / Cmd + 点击整行也能切换选中，方便批量操作
      if (ev.ctrlKey || ev.metaKey) {
        ev.preventDefault();
        toggleSelect(d.key);
        return;
      }
      openDoc(d.key);
    });
    row.addEventListener('keydown', ev => {
      if (ev.key === 'Enter' || ev.key === ' ' || ev.key === 'Spacebar') {
        ev.preventDefault();
        if (ev.ctrlKey || ev.metaKey) toggleSelect(d.key);
        else openDoc(d.key);
      }
    });
    return row;
  }

  function renderFlatList(nav) {
    const q = state.query.toLowerCase();
    const hits = state.docs.filter(d => d.rel.toLowerCase().indexOf(q) >= 0);
    if (!hits.length) {
      nav.innerHTML = '<div class="tree-empty">没有匹配 “' + escHtml(state.query) + '” 的文件。</div>';
      return;
    }
    const box = document.createElement('div');
    box.className = 'flat-section';
    const head = document.createElement('div');
    head.className = 'flat-heading';
    head.textContent = hits.length + ' 个文件';
    box.appendChild(head);
    for (const d of hits) {
      const item = fileItemEl(d);
      const dir = document.createElement('span');
      dir.className = 'fdir';
      dir.textContent = dirname(d.rel) || '';
      if (dir.textContent) item.appendChild(dir);
      box.appendChild(item);
    }
    nav.appendChild(box);
    highlightCurrent();
    syncSelectUI();
  }

  function highlightCurrent() {
    const cur = state.current;
    $$('#fileList .file-item').forEach(el => {
      el.classList.toggle('active', el.dataset.key === cur);
    });
    if (cur) {
      const active = $('#fileList .file-item.active');
      if (active && active.scrollIntoView) {
        const nav = $('#fileList');
        const r = active.getBoundingClientRect();
        const nr = nav.getBoundingClientRect();
        if (r.top < nr.top || r.bottom > nr.bottom) active.scrollIntoView({ block: 'nearest' });
      }
    }
  }

  /* ---------------- 打开文档 ---------------- */
  async function openDoc(key) {
    const doc = state.docMap.get(key);
    if (!doc) return;

    if (state.current && state.current !== key) {
      state.scrollMemory.set(state.current, $('#contentWrap').scrollTop);
    }
    state.current = key;
    highlightCurrent();

    $('#docName').textContent = doc.name;
    $('#docPath').textContent = doc.rel;
    document.title = doc.name + ' · MD Look';
    $('#emptyState').hidden = true;
    $('#content').hidden = false;
    $('#btnCopy').disabled = false;

    // 读文件是异步的：连续点两个文件时，先发的那次可能后返回。
    // 用 token 判断自己是否还是「最新一次打开」，避免旧内容覆盖新内容。
    const token = ++openToken;

    let text;
    try {
      text = await readFileText(doc.file);
    } catch (err) {
      if (token !== openToken) return;
      $('#content').innerHTML = '<div class="render-error"><strong>无法读取文件</strong><pre>' + escHtml(String(err)) + '</pre></div>';
      return;
    }
    if (token !== openToken) return;   // 已经被后一次打开取代，丢弃这次结果

    const wrap = $('#contentWrap');
    wrap.scrollTop = 0;

    // 大文件给个提示
    const isBig = text.length > 400000;
    if (isBig) toast('文件较大（' + prettySize(text.length) + '），渲染可能需要几秒…', 1600);

    const cost = renderMarkdown(text, doc);
    renderOutline();
    updateActiveOutline();

    $('#sourceView').value = text;

    const chars = text.replace(/\s+/g, '').length;
    const minutes = Math.max(1, Math.round(chars / 400));
    $('#docMeta').textContent = chars.toLocaleString('zh-CN') + ' 字 · 约 ' + minutes + ' 分钟 · ' + state.headings.length + ' 个标题 · ' + prettySize(doc.file.size);

    // 恢复滚动位置（同一文件重新打开时）
    const remembered = state.scrollMemory.get(key);
    wrap.scrollTop = typeof remembered === 'number' ? remembered : 0;
    updateProgress();

    // 记住的视图模式（源码 / 预览）在这里落地
    applySourceMode(prefs.view === 'source');

    if (window.innerWidth <= 860) {
      document.body.classList.remove('sidebar-open');
    }
    if (cost > 1200) toast('渲染耗时 ' + Math.round(cost) + ' ms', 1500);
  }

  function readFileText(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const buf = reader.result;
        const bytes = new Uint8Array(buf);
        let text = '';

        if (bytes.length >= 3 && bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) {
          text = new TextDecoder('utf-8').decode(bytes.subarray(3));
        } else if (bytes.length >= 2 && bytes[0] === 0xFF && bytes[1] === 0xFE) {
          text = new TextDecoder('utf-16le').decode(bytes.subarray(2));
        } else if (bytes.length >= 2 && bytes[0] === 0xFE && bytes[1] === 0xFF) {
          text = new TextDecoder('utf-16be').decode(bytes.subarray(2));
        } else {
          try {
            // 严格模式：遇到非法 UTF-8 序列会抛错
            text = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
          } catch (e) {
            try {
              text = new TextDecoder('gb18030').decode(bytes);
              toast('检测到 GBK/GB18030 编码，已自动转换');
            } catch (e2) {
              text = new TextDecoder('utf-8').decode(bytes);
            }
          }
        }
        if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
        resolve(text);
      };
      reader.onerror = () => reject(reader.error || new Error('读取失败'));
      reader.readAsArrayBuffer(file);
    });
  }

  /* ---------------- 大纲 ---------------- */
  function renderOutline() {
    const nav = $('#outlineList');
    const section = $('#outlineSection');
    nav.innerHTML = '';

    // 没有打开文档、或文档里没有标题时，整个大纲区直接隐藏（不显示任何提示文字）
    if (!state.current || !state.headings.length) {
      if (section) section.hidden = true;
      return;
    }
    if (section) section.hidden = false;

    const frag = document.createDocumentFragment();
    state.headings.forEach(h => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'outline-item';
      btn.dataset.target = h.id;
      btn.style.paddingLeft = (6 + (h.level - 1) * 12) + 'px';
      const badge = document.createElement('span');
      badge.className = 'ob';
      badge.textContent = 'H' + h.level;
      btn.appendChild(badge);
      btn.appendChild(document.createTextNode(h.text));
      btn.title = h.text;
      btn.addEventListener('click', () => {
        const target = document.getElementById(h.id);
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          if (window.innerWidth <= 860) document.body.classList.remove('sidebar-open');
        }
      });
      frag.appendChild(btn);
    });
    nav.appendChild(frag);
  }

  let ticking = false;
  function onContentScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      ticking = false;
      updateProgress();
      updateActiveOutline();
      $('#backTop').classList.toggle('show', $('#contentWrap').scrollTop > 600);
    });
  }

  function updateProgress() {
    const wrap = $('#contentWrap');
    const max = wrap.scrollHeight - wrap.clientHeight;
    const pct = max > 0 ? Math.min(100, Math.max(0, (wrap.scrollTop / max) * 100)) : 0;
    $('#progress').style.width = pct.toFixed(2) + '%';
  }

  function updateActiveOutline() {
    if (!state.headings.length) return;
    const wrap = $('#contentWrap');
    const top = wrap.getBoundingClientRect().top;
    let activeId = state.headings[0].id;
    for (const h of state.headings) {
      const el = document.getElementById(h.id);
      if (!el) continue;
      if (el.getBoundingClientRect().top - top <= 90) activeId = h.id;
      else break;
    }
    $$('#outlineList .outline-item').forEach(el => {
      el.classList.toggle('active', el.dataset.target === activeId);
    });
    const act = $('#outlineList .outline-item.active');
    if (act) {
      const box = $('#outlineList');
      const r = act.getBoundingClientRect();
      const br = box.getBoundingClientRect();
      if (r.top < br.top || r.bottom > br.bottom) act.scrollIntoView({ block: 'nearest' });
    }
  }

  /* ---------------- 复制 / 打印 ---------------- */
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
    }
    return Promise.resolve(fallbackCopy(text));
  }
  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    if (!ok) toast('复制失败，请手动选择文本');
    return ok;
  }

  /* ---------------- 主题 / 字号 / 视图 ---------------- */
  // 深浅色由 template.html 头部的内联脚本跟随系统 prefers-color-scheme，
  // 这里不再提供手动切换，也没有 data-theme 的写入点。

  function applyFontSize() {
    document.documentElement.style.setProperty('--content-font', prefs.fontSize + 'px');
    $('#btnFontDown').disabled = prefs.fontSize <= FONT_MIN;
    $('#btnFontUp').disabled = prefs.fontSize >= FONT_MAX;
    const reset = $('#btnFontReset');
    // 已是默认字号时重置按钮不可用，避免点了没反应
    if (reset) reset.disabled = prefs.fontSize === FONT_DEFAULT;
  }

  function setSourceMode(on) {
    if (on && !state.current) { toast('请先打开一个 Markdown 文件'); return false; }
    applySourceMode(on);
    prefs.view = on ? 'source' : 'preview';
    savePrefs();
    return true;
  }

  // 只改界面，不写偏好；用于「清空文档」等不该覆盖用户偏好的场合
  function applySourceMode(on) {
    document.body.classList.toggle('source-mode', !!on);
    $('#sourceView').hidden = !on;
    $('#btnSource').classList.toggle('active', !!on);
    $('#btnSource').title = on ? '返回预览' : '查看 Markdown 源码';
  }

  /* ---------------- 事件绑定 ---------------- */
  function bindEvents() {
    // 顶部已无「打开文件 / 打开文件夹」按钮：
    // 打开入口 = 双击空白处 / 拖放 / Ctrl+O / Ctrl+Shift+O

    // 清除：只删除已勾选的文件
    $('#btnClearFiles').addEventListener('click', clearSelected);

    // 空状态：整个空白区域双击选择文件（该区域没有任何可见 UI）
    $('#emptyState').addEventListener('dblclick', ev => {
      if (ev.target.closest('a, button')) return;
      $('#fileInput').click();
    });

    $('#fileInput').addEventListener('change', ev => {
      const files = ev.target.files;
      if (files && files.length) afterLibraryChange(addFiles(files), false);
      ev.target.value = '';
    });
    $('#dirInput').addEventListener('change', ev => {
      const files = ev.target.files;
      if (files && files.length) {
        resetLibrary();
        afterLibraryChange(addFiles(files), true);
      }
      ev.target.value = '';
    });

    $('#searchInput').addEventListener('input', ev => {
      state.query = ev.target.value.trim();
      $('#searchClear').classList.toggle('show', !!state.query);
      renderFileList();
    });
    $('#searchInput').addEventListener('keydown', ev => {
      if (ev.key === 'Escape') {
        ev.target.value = '';
        state.query = '';
        $('#searchClear').classList.remove('show');
        renderFileList();
        ev.target.blur();
      }
    });
    $('#searchClear').addEventListener('click', () => {
      $('#searchInput').value = '';
      state.query = '';
      $('#searchClear').classList.remove('show');
      renderFileList();
      $('#searchInput').focus();
    });

    $('#btnFontUp').addEventListener('click', () => {
      prefs.fontSize = Math.min(FONT_MAX, prefs.fontSize + 1);
      applyFontSize(); savePrefs();
    });
    $('#btnFontDown').addEventListener('click', () => {
      prefs.fontSize = Math.max(FONT_MIN, prefs.fontSize - 1);
      applyFontSize(); savePrefs();
    });
    $('#btnFontReset').addEventListener('click', () => {
      if (prefs.fontSize === FONT_DEFAULT) return;
      prefs.fontSize = FONT_DEFAULT;
      applyFontSize(); savePrefs();
      toast('字号已重置为 ' + FONT_DEFAULT + 'px');
    });
    $('#btnSource').addEventListener('click', () => setSourceMode(!document.body.classList.contains('source-mode')));
    $('#btnCopy').addEventListener('click', () => {
      const text = $('#sourceView').value;
      if (!text) { toast('没有可复制的内容'); return; }
      copyText(text).then(() => toast('已复制 Markdown 原文'));
    });

    $('#btnMenu').addEventListener('click', () => {
      if (window.innerWidth <= 860) document.body.classList.toggle('sidebar-open');
      else {
        prefs.sidebar = !prefs.sidebar;
        document.body.classList.toggle('sidebar-collapsed', !prefs.sidebar);
        savePrefs();
        setTimeout(updateActiveOutline, 200);
      }
    });
    $('#sidebarBackdrop').addEventListener('click', () => document.body.classList.remove('sidebar-open'));

    $('#contentWrap').addEventListener('scroll', onContentScroll, { passive: true });
    $('#backTop').addEventListener('click', () => $('#contentWrap').scrollTo({ top: 0, behavior: 'smooth' }));

    // 图片加载失败
    $('#content').addEventListener('error', ev => {
      const t = ev.target;
      if (t && t.tagName === 'IMG' && !t.dataset.failed) {
        t.dataset.failed = '1';
        const src = t.dataset.missing || t.getAttribute('src') || '';
        const span = document.createElement('span');
        span.className = 'img-missing';
        span.textContent = '图片无法显示' + (t.alt ? '：' + t.alt : '') + (src && !String(src).startsWith('blob:') ? '（' + src + '）' : '');
        t.replaceWith(span);
      }
    }, true);

    // 拖放
    let dragDepth = 0;
    const overlay = $('#dropOverlay');
    const hasFiles = dt => !!dt && Array.prototype.indexOf.call(dt.types || [], 'Files') >= 0;

    window.addEventListener('dragenter', ev => {
      if (!hasFiles(ev.dataTransfer)) return;
      ev.preventDefault();
      dragDepth++;
      overlay.classList.add('show');
    });
    window.addEventListener('dragover', ev => {
      if (hasFiles(ev.dataTransfer)) {
        ev.preventDefault();
        try { ev.dataTransfer.dropEffect = 'copy'; } catch (e) { /* ignore */ }
      }
    });
    window.addEventListener('dragleave', ev => {
      if (ev.relatedTarget === null) { dragDepth = 0; overlay.classList.remove('show'); return; }
      dragDepth = Math.max(0, dragDepth - 1);
      if (!dragDepth) overlay.classList.remove('show');
    });
    window.addEventListener('drop', ev => {
      ev.preventDefault();
      dragDepth = 0;
      overlay.classList.remove('show');
      if (!ev.dataTransfer) return;
      // 注意：不能在这里 await 之后再去碰 ev.dataTransfer，那时它已经被浏览器清空。
      // collectDroppedFiles 会在第一个 await 之前把能同步取到的都取走。
      collectDroppedFiles(ev.dataTransfer).then(files => {
        if (!files.length) { toast('没有识别到文件'); return; }
        const hasFolder = files.some(f => f._relOverride);
        if (hasFolder) resetLibrary();
        afterLibraryChange(addFiles(files), hasFolder);
      }).catch(err => {
        console.error('[MD Look] 拖放处理失败', err);
        toast('拖放处理失败：' + (err && err.message ? err.message : '未知错误'));
      });
    });

    // 快捷键
    document.addEventListener('keydown', ev => {
      const tag = (ev.target && ev.target.tagName) || '';
      const typing = tag === 'INPUT' || tag === 'TEXTAREA' || (ev.target && ev.target.isContentEditable);
      const mod = ev.ctrlKey || ev.metaKey;

      if (mod && ev.key.toLowerCase() === 'o') {
        ev.preventDefault();
        if (ev.shiftKey) $('#dirInput').click();
        else $('#fileInput').click();
        return;
      }
      // Ctrl/Cmd+P 交回浏览器（打印）
      if (mod && ev.key.toLowerCase() === 'p') return;

      // 按 / 聚焦文件筛选框（Ctrl+F 留给浏览器自己的查找）
      if (!typing && !mod && ev.key === '/') {
        ev.preventDefault();
        $('#searchInput').focus();
        $('#searchInput').select();
        return;
      }
      if (ev.key === 'Escape') {
        if (document.body.classList.contains('sidebar-open')) document.body.classList.remove('sidebar-open');
        // 触发灯箱自己的 close()，确保 keydown 监听被摘掉
        const lb = document.querySelector('.lightbox');
        if (lb) lb.click();
      }
    });
  }

  async function collectDroppedFiles(dt) {
    // 关键：drop 事件处理函数返回（或进入 await）之后，浏览器会清空 dataTransfer，
    // 此时再读 dt.files / dt.items / dt.getData 都会得到空集合。
    // 所以凡是同步能取的，必须在这一段同步代码里一次性取完。
    const flat = dt.files ? Array.prototype.slice.call(dt.files) : [];
    const itemFiles = [];
    const dirs = [];
    const items = dt.items ? Array.prototype.slice.call(dt.items) : [];

    for (const it of items) {
      if (it.kind !== 'file') continue;
      let entry = null;
      if (it.webkitGetAsEntry) {
        try { entry = it.webkitGetAsEntry(); } catch (e) { entry = null; }
      }
      if (entry && entry.isDirectory) { dirs.push(entry); continue; }
      // 同步取一份 File 引用，作为 entry.file() 失败时的兜底
      try {
        const f = it.getAsFile();
        if (f) itemFiles.push(f);
      } catch (e) { /* ignore */ }
    }

    const syncSnapshot = flat.length ? flat : itemFiles;

    // 纯文件拖入：直接用同步快照，最可靠
    if (!dirs.length) return syncSnapshot;

    // 含文件夹：异步递归；拿不到任何东西就退回同步快照
    const out = [];
    for (const dir of dirs) {
      try { await walkEntry(dir, '', out, 0); } catch (e) { /* ignore */ }
    }
    return out.length ? out : syncSnapshot;
  }

  function walkEntry(entry, prefix, out, depth) {
    if (depth > 12 || out.length > 4000) return Promise.resolve();
    if (entry.isFile) {
      return new Promise(resolve => {
        entry.file(f => {
          f._relOverride = prefix + f.name;
          out.push(f);
          resolve();
        }, () => resolve());
      });
    }
    if (entry.isDirectory) {
      const reader = entry.createReader();
      const readBatch = () => new Promise(resolve => {
        reader.readEntries(batch => resolve(Array.prototype.slice.call(batch)), () => resolve([]));
      });
      return (async () => {
        let batch;
        do {
          batch = await readBatch();
          for (const child of batch) {
            await walkEntry(child, prefix + entry.name + '/', out, depth + 1);
          }
        } while (batch.length);
      })();
    }
    return Promise.resolve();
  }

  function afterLibraryChange(result, isFolder) {
    const added = result.added.length;
    const requested = result.requested;
    refreshLibraryUI();

    if (!requested.length) {
      if (!state.docs.length) toast('没有识别到 .md / .txt 文件');
      else toast('没有识别到可打开的文件');
      return;
    }

    let target;
    if (!state.current || isFolder) {
      const readme = requested.find(d => /^readme\.(md|markdown|txt)$/i.test(d.name));
      target = readme || requested[0];
    } else {
      target = requested[0];
    }

    if (target && target.key !== state.current) openDoc(target.key);
    else if (target && !added) toast('该文件已经打开');

    if (added) toast('已加载 ' + added + ' 个 Markdown 文件');
  }

  /* ---------------- 启动 ---------------- */
  function init() {
    loadPrefs();
    applyFontSize();
    document.body.classList.toggle('sidebar-collapsed', !prefs.sidebar);
    configureMarked();
    bindEvents();
    refreshLibraryUI();
    // 没有文档时不进源码视图（prefs.view 会在打开文档时生效）
    applySourceMode(false);
    window.addEventListener('beforeunload', () => {
      state.urls.forEach(u => { try { URL.revokeObjectURL(u); } catch (e) {} });
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
</body>
</html>
